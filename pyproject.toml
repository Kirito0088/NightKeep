[project]
name = "nightkeep"
version = "0.1.0"
description = "Learns the chaos. Catches the crime. Ransomware defence for an erratic district PDS server."
requires-python = ">=3.11,<3.12"
dependencies = [
    "watchdog>=4.0",
    "psutil>=5.9",
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "Flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: touches the filesystem, a subprocess or the simulated clock. Skip with -m 'not slow'",
]


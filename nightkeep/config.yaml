# Every tunable number in Nightkeep. Nothing here is duplicated in code.
# Read exactly once, at start-up, by nightkeep/config.py. Modules take these
# values as arguments from the entrypoint and never reach for this file.

district:
  ration_cards: 5000
  fps_count: 50
  members_per_card:
    low: 1
    high: 7
  transactions_per_card_per_month:
    low: 0
    high: 2

# One seed drives the whole run: the district, every job's randomness, the
# harvest surge. A judge who picks a seed gets the same run back.
seed: 20260922

clock:
  # Real seconds per simulated day. 10 keeps a rehearsal quick: seven
  # learning days in about 70 s (ADR-0012). --day-seconds overrides it.
  simulated_day_seconds: 10
  # A simulated day is one shop day followed by its night: it runs from this
  # time until the same time next morning, so every night job lands in it.
  day_starts_at: "06:00"
  learning_days: 7
  guard_days: 3

harvest_surge:
  # Peak season. Legitimate, and must not alarm. Day 4 falls inside learning so
  # the habit cards see a surge; day 9 falls inside the guard days so P1 is
  # actually exercised.
  days: [4, 9]
  multiplier: 2.0

jobs:
  # The six jobs a district PDS setup really runs, each messy on purpose.
  # Times are 24-hour HH:MM. volume_variation is a fraction: 0.30 means the
  # run's volume moves plus or minus 30 percent. runs_for_minutes is how long
  # the job occupies the night in simulated minutes, drawn from the seed.
  # It is deliberately not the subprocess's real duration: the truth log has
  # to read the same on a fast machine and a slow one, and a job that overruns
  # must push the next job later by a seeded amount, not a measured one.

  nightly_export:
    # Day-end export of transactions for the state server.
    start_window: {earliest: "01:00", latest: "02:30"}
    volume_variation: 0.30
    rows_per_run: {low: 180, high: 320}
    network_down_probability: 0.12
    runs_for_minutes: {low: 4, high: 30}

  allocation_gen:
    # Next month's grain quota file for each shop. Big run on the 1st, small
    # top-ups mid-month, and a vendor bug that sometimes runs it twice.
    start_window: {earliest: "23:15", latest: "00:45"}
    volume_variation: 0.20
    month_start_day: 1
    double_run_probability: 0.15
    files_on_month_start: {low: 50, high: 50}
    files_on_a_top_up: {low: 3, high: 12}
    runs_for_minutes: {low: 2, high: 15}

  archive_old:
    # Zips old exports and deletes the originals. Only fires when the folder
    # crosses the size limit, so it lands on random nights. A night's export
    # measures 16 to 25 KB (a harvest surge night about twice that), so the
    # folder crosses this line every third or fourth night, empties itself,
    # and goes quiet until the exports pile up again. In kilobytes, not
    # megabytes: the job's own arithmetic is cmd integer maths, so a fraction
    # of a megabyte cannot be expressed.
    start_window: {earliest: "03:00", latest: "04:30"}
    volume_variation: 0.25
    size_threshold_kb: 60
    files_zipped_per_run: {low: 20, high: 90}
    runs_for_minutes: {low: 1, high: 12}

  db_backup:
    # The nightly database backup file the Vault pulls. Runs after the export,
    # so its start time drifts with it rather than having a window of its own.
    delay_after_export_minutes: {low: 10, high: 45}
    volume_variation: 0.15
    runs_for_minutes: {low: 3, high: 20}

  fix_dat:
    # The undocumented script. Renames .tmp to .dat and rewrites allocation
    # files in place, some nights only. The hardest legitimate job to tell
    # from ransomware, which is why it exists.
    start_window: {earliest: "02:00", latest: "05:00"}
    volume_variation: 0.40
    run_probability: 0.45
    runs_for_minutes: {low: 1, high: 9}

  operator_activity:
    # Clerks editing records in office hours. Never on a Sunday.
    start_window: {earliest: "10:00", latest: "17:00"}
    volume_variation: 0.50
    edits_per_day: {low: 5, high: 40}
    skip_sundays: true
    runs_for_minutes: {low: 20, high: 120}

watcher:
  # How often psutil is asked which process is writing. MVP F3 says 2 s.
  poll_seconds: 2
  # A job's last writes can land a moment after its process exits. Events
  # inside this many seconds of the run's end still belong to that run.
  settle_seconds: 1.0
  # F11: the watcher agent rewrites the liveness file in the share this
  # often, so the Vault can tell a live watcher from a killed one.
  # SOLUTION_DESIGN.md S6: the Vault asks every 10 s [TUNE].
  heartbeat_interval_seconds: 10
  # F11: silence longer than this is S6 -- the watcher may be dead.
  # SOLUTION_DESIGN.md S6: no answer for 30 s [TUNE].
  silence_threshold_seconds: 30
  # F11: the Vault checks the watcher's liveness this often during normal
  # operation. The Vault asks; the server only answers, through the share.
  # SOLUTION_DESIGN.md S6: every 10 s [TUNE].
  liveness_check_interval_seconds: 10

habit:
  # A feature counts as unusual when it sits outside median +/- k * MAD.
  # 3.0 is the usual robust-statistics choice and survives the harvest surge.
  mad_multiplier: 3.0
  # Below this many observed runs there is no card yet, so there is no score
  # to give. A job seen for the first time is flagged novel, not unusual.
  min_runs_before_scoring: 3
  # A MAD of zero (a job that never varies) would make every run infinitely
  # unusual. Treat the spread as at least this fraction of the median.
  minimum_spread_fraction: 0.10

judge:
  # MVP section 10. The learned score alone never crosses any of these.
  odd_score: 0.5
  # S4: this many renames to an extension no job has ever produced.
  rename_burst: 10
  # S3: entropy is bits per byte, 0 to 8. A rewrite is a scramble when the
  # file's entropy climbs by this much AND ends above the floor AND its
  # header stops matching its extension. All three, never one alone.
  entropy_jump: 1.5
  entropy_floor: 7.0
  # S5: system-restore-deletion command text. Matched as text in a file or a
  # process command line. Nightkeep never runs these, and neither does the
  # simulator: it only echoes them.
  recovery_commands:
    - "vssadmin delete shadows"
    - "wbadmin delete catalog"
    - "bcdedit /set recoveryenabled no"
  # S2: canary files that look like real exports. No legitimate job touches
  # them. Reading one is fine; changing, renaming or deleting one is not.
  # Both live inside share/, the one folder the PDS server shares with the
  # Vault (ADR-0007): a canary outside it would not be covered by the Vault
  # pull, the Judge's read-only containment, or the restore proof.
  canary_files:
    - "share/exports/epos_day_end_20240101.csv"
    - "share/allocations/fps_quota_2024_01.csv"

vault:
  # The Vault opens every connection, on its own clock. One pull an hour of
  # simulated time. The PDS server is never asked and never told.
  pull_every_simulated_minutes: 60
  # A file whose entropy is above this and whose header no longer matches
  # its extension makes the whole snapshot SUSPECT.
  suspect_entropy: 7.0
  # Restores land here, beside the damaged data and never on top of it.
  restore_folder_name: "restored"
  # Fraction of the last clean snapshot's files that were changed or removed
  # that marks a pull SUSPECT. New files do not count: the office adds files
  # every night (issue #20).
  suspect_changed_fraction: 0.5
  # Fractional drop in the ration-card record count versus the last clean
  # snapshot that marks a pull SUSPECT.
  suspect_record_drop_fraction: 0.02

simulator:
  # The safe ransomware simulator. It refuses to run outside the demo folder.
  locked_extension: ".locked"
  # Written into every folder it touches, as real ransomware does.
  ransom_note_name: "HOW_TO_GET_YOUR_FILES_BACK.txt"
  # The known key, so decrypt.py can always put everything back. A real
  # sample would never ship its key: that is exactly the point.
  key: "nightkeep-demo-key-not-a-secret"
  # Pause between files, so a human on stage can watch it happen.
  delay_between_files_seconds: 0.01

console:
  # The Vault's own screen. Restore, delete and settings need this PIN
  # (MVP.md F9); the restore screen asks for it before Vault.restore()
  # runs. Demo value: change it on the real Vault machine.
  supervisor_pin: "246810"
  # How often an open console page asks the live session whether anything
  # changed, in seconds. The page reloads only when something did.
  status_refresh_seconds: 2
  # The safe simulator variants the demo controls offer (MVP.md F10, the
  # three Round 2 variants). The first one is selected by default.
  attack_variants: ["fast", "impersonator", "recovery-killer"]
  # The variant the Full MVP Demo launches by itself after the guard days.
  full_demo_variant: "recovery-killer"
  # A-, A and A+ in the top strip step through these text sizes. 1.0 is the
  # normal size the A button returns to.
  text_scale_steps: [0.875, 1.0, 1.125, 1.25]

live:
  # The live session engine plays the district PDS server while the console
  # runs. It reads the demo controls (harvest surge, simulated attack,
  # restore finished) this often, in seconds.
  command_poll_seconds: 0.5
  # How many of the most recent night checks the session keeps for the
  # Night Jobs screen.
  recent_checks_kept: 12

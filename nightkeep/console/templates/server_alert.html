<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nightkeep Security Alert</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="server-alert-page">
  <div class="server-alert-backdrop">
    <div class="server-alert-window" role="alertdialog" aria-modal="true" aria-labelledby="server-alert-title" aria-describedby="server-alert-headline">
      <header class="server-alert-header">
        <h1 id="server-alert-title" class="server-alert-header-title">{{ t(alert.title) }}</h1>
      </header>

      <div class="server-alert-body">
        <div class="server-alert-banner">
          <h2 id="server-alert-headline" class="server-alert-headline">{{ t(alert.headline) }}</h2>
        </div>

        <ol class="server-alert-actions-list">
          {% for action in alert.actions %}
            <li class="server-alert-action-item {% if loop.first %}server-alert-action-highlight{% endif %}">
              <span class="server-alert-action-number" aria-hidden="true">{{ loop.index }}</span>
              <span class="server-alert-action-text">{{ action }}</span>
            </li>
          {% endfor %}
        </ol>

        <div class="server-alert-footer">
          <div class="server-alert-buttons">
            <button type="button" class="btn btn-primary btn-alert-ack">{{ t("Acknowledge") }}</button>
            <a href="{{ url_for('nightkeep_alert') }}" class="btn btn-secondary btn-alert-vault-link">{{ t("Open Vault Console (Simulation)") }}</a>
          </div>
          <p class="server-alert-disclaimer">Prototype on invented data. Not a live government system.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The nightly jobs launch cmd.exe and cscript.exe, so the suite runs on the
# Windows target, not on Linux, exactly as it runs on the build machines.
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q
